<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">doppelcat diff view</title>
  <desc id="desc">A terminal showing a one-column diff with removed lines in red and added lines in green.</desc>
  <rect width="1200" height="700" rx="18" fill="#111827"/>
  <rect x="1" y="1" width="1198" height="698" rx="17" fill="none" stroke="#374151" stroke-width="2"/>
  <circle cx="34" cy="31" r="8" fill="#ef4444"/><circle cx="60" cy="31" r="8" fill="#f59e0b"/><circle cx="86" cy="31" r="8" fill="#22c55e"/>
  <text x="600" y="38" text-anchor="middle" fill="#d1d5db" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">doppelcat — requirements.md</text>
  <line x1="0" y1="58" x2="1200" y2="58" stroke="#374151"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22">
    <text x="38" y="100" fill="#9ca3af">      38  ### 更新の検知</text>
    <text x="38" y="138" fill="#9ca3af">      39</text>
    <text x="38" y="176" fill="#f87171">-     40  - 対象ファイルの変更時に再読込する。</text>
    <text x="38" y="214" fill="#4ade80">+     40  - 外部プロセスによる更新を自動的に検知する。</text>
    <text x="38" y="252" fill="#4ade80">+     41  - 短時間に連続する更新は安定するまでまとめる。</text>
    <text x="38" y="290" fill="#9ca3af">      42  - 最新の安定状態を直前の状態と比較する。</text>
    <text x="38" y="328" fill="#9ca3af">      43</text>
    <text x="38" y="366" fill="#9ca3af">      44  ### 差分の表示</text>
    <text x="38" y="404" fill="#9ca3af">      45</text>
    <text x="38" y="442" fill="#f87171">-     46  - 更新内容を左右に表示する。</text>
    <text x="38" y="480" fill="#4ade80">+     46  - 差分を1列の行単位表示で確認できる。</text>
    <text x="38" y="518" fill="#4ade80">+     47  - 追加と削除は記号と色の両方で識別する。</text>
    <text x="38" y="556" fill="#9ca3af">      48  - d キーで通常表示と差分表示を切り替える。</text>
  </g>
  <rect x="0" y="626" width="1200" height="74" fill="#0b1220"/>
  <line x1="0" y1="626" x2="1200" y2="626" stroke="#374151"/>
  <text x="28" y="670" fill="#e5e7eb" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19">requirements.md | DIFF | line 38 | ↑↓ Ctrl+Home/End  d:toggle  e:edit  q:quit</text>
</svg>
