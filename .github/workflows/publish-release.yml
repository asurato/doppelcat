name: Publish release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to increment from the latest release tag
        required: true
        type: choice
        default: patch
        options:
          - major
          - minor
          - patch

permissions:
  contents: read

jobs:
  prepare:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases must be started from main, not ${{ github.ref }}." >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        name: Calculate next version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)
          if [ -z "$latest" ]; then
            latest=v0.0.0
          fi
          if ! [[ "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Latest tag is not a stable semantic version: $latest" >&2
            exit 1
          fi
          major=${BASH_REMATCH[1]}
          minor=${BASH_REMATCH[2]}
          patch=${BASH_REMATCH[3]}
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "Unsupported version bump: $BUMP" >&2; exit 1 ;;
          esac
          version="v${major}.${minor}.${patch}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Next release: $version"

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip
          - goos: windows
            goarch: arm64
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Test
        run: go test ./...
      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ARCHIVE: ${{ matrix.archive }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          name="doppelcat_${VERSION#v}_${GOOS}_${GOARCH}"
          mkdir -p dist/"$name"
          extension=""
          if [ "$GOOS" = windows ]; then extension=.exe; fi
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o dist/"$name"/doppelcat"$extension" ./cmd/doppelcat
          cp README.md LICENSE dist/"$name"/
          if [ "$ARCHIVE" = zip ]; then
            (cd dist && zip -r "$name.zip" "$name")
          else
            tar -C dist -czf dist/"$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: doppelcat_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > checksums.txt
      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ github.sha }}
        run: |
          gh release create "$VERSION" dist/* \
            --target "$TARGET" \
            --title "doppelcat $VERSION" \
            --generate-notes
